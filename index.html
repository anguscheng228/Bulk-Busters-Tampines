<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BULK BUSTERS @ Tampines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; background:#060809; overflow:hidden; touch-action:none; font-family:'Press Start 2P',monospace; margin:0; padding:0; }
/* Eliminate any browser-injected padding in fullscreen */
:fullscreen { padding:0!important; margin:0!important; }
:-webkit-full-screen { padding:0!important; margin:0!important; }
:-moz-full-screen { padding:0!important; margin:0!important; }
:fullscreen #wrapper, :-webkit-full-screen #wrapper, :-moz-full-screen #wrapper {
  inset:0!important; top:0!important;
}
#wrapper { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#060809; }
#gameCanvas { display:block; image-rendering:pixelated; image-rendering:crisp-edges; cursor:crosshair; }
.overlay {
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  background:rgba(6,8,9,0.95); z-index:20; gap:6px;
}
#endScreen { display:none; }
.eyebrow { color:#4a5a3a; letter-spacing:5px; text-transform:uppercase; font-size:9px; }
.game-title { color:#c8b89a; font-weight:bold; letter-spacing:5px; text-transform:uppercase; font-size:34px;
  text-shadow:0 0 40px rgba(200,184,154,0.22); }
.game-at { color:#7ab050; letter-spacing:4px; font-size:12px; }
.game-loc { color:#6a7a5a; letter-spacing:7px; font-size:10px; }
.divider { width:100px; height:1px; background:linear-gradient(90deg,transparent,#3d4560,transparent); margin:4px 0; }
.tagline { color:#4a5a3a; letter-spacing:2px; text-align:center; font-size:9px; }
.instr { color:#5a6a4a; line-height:2; text-align:center; font-size:9px; }
.instr span { color:#a8a080; }
.btn { background:none; border:1px solid currentColor; font-family:'Press Start 2P',monospace; letter-spacing:1px;
  text-transform:uppercase; cursor:pointer; padding:9px 32px; font-size:10px;
  transition:background 0.15s, color 0.15s; margin-top:6px; }
.btn:hover,.btn:active { filter:brightness(1.4); }
#startBtn { color:#7ab050; }
#startBtn:hover { background:#7ab050; color:#060809; }
#restartBtn { color:#c8b89a; }
#restartBtn:hover { background:#c8b89a; color:#060809; }
#endTitle { letter-spacing:4px; text-align:center; font-size:18px; color:#c8b89a; }
#endStats { color:#5a6a4a; letter-spacing:1px; line-height:2.2; text-align:center; font-size:9px; }
#endStats span { color:#a8a080; }
#endFact { color:#3a4a2a; max-width:360px; text-align:center; line-height:1.8; font-size:8px;
  border-left:2px solid #2a3a1a; padding-left:10px; }
#hiScore { color:#7ab050; letter-spacing:2px; font-size:9px; }
#fsBtn {
  position:absolute; bottom:10px; right:10px; background:rgba(6,8,9,0.8);
  border:1px solid #2a3040; color:#3a4050; width:28px; height:28px; font-size:15px;
  cursor:pointer; z-index:30; display:flex; align-items:center; justify-content:center;
  transition:color 0.2s,border-color 0.2s; line-height:1;
}
#fsBtn:hover { color:#c8b89a; border-color:#c8b89a; }

@keyframes titlePulse {
  0%,100% { text-shadow:4px 4px 0 #1a4008,-1px -1px 0 #1a4008,1px -1px 0 #1a4008,-1px 1px 0 #1a4008,0 0 24px rgba(122,176,80,0.7),0 0 48px rgba(122,176,80,0.35); }
  50%      { text-shadow:4px 4px 0 #1a4008,-1px -1px 0 #1a4008,1px -1px 0 #1a4008,-1px 1px 0 #1a4008,0 0 36px rgba(122,176,80,1.0),0 0 70px rgba(122,176,80,0.6); }
}
@keyframes subFloat {
  0%,100% { transform:translateY(0); }
  50%      { transform:translateY(-3px); }
}
@keyframes btnPulse {
  0%,100% { box-shadow:0 0 20px rgba(122,176,80,0.8),0 4px 0 #1a4008; transform:scale(1); }
  50%      { box-shadow:0 0 36px rgba(122,176,80,1.0),0 4px 0 #1a4008,0 0 60px rgba(200,240,140,0.4); transform:scale(1.04); }
}
#tTitle { animation: titlePulse 3s ease-in-out infinite; }
#tSub   { animation: subFloat  2.4s ease-in-out infinite; }
#startBtn { animation: btnPulse 1.8s ease-in-out infinite; }
#startBtn:hover { animation:none; filter:brightness(1.25); transform:scale(1.06); }
#startBtn:active { transform:scale(0.97); }
</style>
</head>

      <button id="startBtn" style="font-family:'Press Start 2P',monospace;font-weight:bold;text-transform:uppercase;letter-spacing:4px;cursor:pointer;font-size:clamp(10px,1.6vw,14px);padding:clamp(8px,1.2vh,13px) clamp(22px,3.5vw,40px);color:#0a1408;background:#7ab050;border:3px solid #c8f090;box-shadow:0 0 20px rgba(122,176,80,0.8),0 4px 0 #1a4008;margin-bottom:clamp(14px,4vh,32px);">▶ START PATROL</button>

    </div>
  </div>

  <div id="endScreen" class="overlay" style="background:rgba(6,12,4,0.93);gap:0;">
    <div id="endTitle" style="font-family:'Press Start 2P',monospace;letter-spacing:4px;text-align:center;font-size:clamp(20px,4vw,38px);color:#c8b89a;text-transform:uppercase;margin-bottom:10px;"></div>
    <div class="divider"></div>
    <div id="endStats" style="color:#8aaa68;letter-spacing:1px;line-height:2.4;text-align:center;font-family:'Press Start 2P',monospace;font-size:clamp(13px,2.4vw,20px);margin:8px 0;"></div>
    <div id="endFact" style="margin:10px 0 6px;color:#5a7a40;max-width:min(420px,88vw);text-align:center;line-height:1.9;font-family:'Press Start 2P',monospace;font-size:clamp(11px,1.8vw,15px);border-left:2px solid #3a5a20;padding-left:12px;"></div>
    <div id="hiScore" style="margin:6px 0 16px;color:#7ab050;letter-spacing:2px;font-family:'Press Start 2P',monospace;font-size:clamp(12px,2.2vw,18px);"></div>
    <button id="restartBtn" style="font-family:'Press Start 2P',monospace;font-weight:bold;text-transform:uppercase;letter-spacing:4px;cursor:pointer;font-size:clamp(11px,2vw,16px);padding:clamp(10px,1.5vh,16px) clamp(28px,4vw,48px);color:#0a1408;background:#7ab050;border:3px solid #c8f090;box-shadow:0 0 16px rgba(122,176,80,0.7),0 4px 0 #1a4008;">↩ BACK TO TITLE</button>
  </div>

  <button id="fsBtn" title="Fullscreen">⛶</button>
</div>

<script>
// ═══════════════════════════════════
//  CANVAS — LANDSCAPE 16:10
// ═══════════════════════════════════
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');
const VW=240, VH=150;
let SCALE=1;

function computeScale(){
  // Use visualViewport when available (most accurate in fullscreen)
  const vvp = window.visualViewport;
  const w = vvp ? vvp.width  : (isFS() ? screen.width  : window.innerWidth);
  const h = vvp ? vvp.height : (isFS() ? screen.height : window.innerHeight);
  return Math.max(1,Math.min(Math.floor(w/VW),Math.floor(h/VH),7));
}
function applyScale(){
  SCALE=computeScale();
  canvas.width=VW*SCALE; canvas.height=VH*SCALE;
  ctx.imageSmoothingEnabled=false;
  // Force wrapper to truly fill viewport after fullscreen
  const wrapper=document.getElementById('wrapper');
  if(isFS()){
    wrapper.style.top='0';
    wrapper.style.left='0';
    wrapper.style.width='100vw';
    wrapper.style.height='100vh';
  } else {
    wrapper.style.top='';
    wrapper.style.left='';
    wrapper.style.width='';
    wrapper.style.height='';
  }
}
applyScale();
window.addEventListener('resize',applyScale);

// ═══════════════════════════════════
//  FULLSCREEN  (mobile-safe)
// ═══════════════════════════════════
const fsBtn=document.getElementById('fsBtn');
const isIOS=/iP(hone|od|ad)/.test(navigator.userAgent);
let fakeFS=false;

function isFS(){ return !!(document.fullscreenElement||document.webkitFullscreenElement); }

function enterFS(){
  const el=document.documentElement;
  const req=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen;
  if(req){
    try{ req.call(el); }catch(e){}
  } else {
    // iOS Safari fallback: scroll address bar away + fix body
    fakeFS=true;
    window.scrollTo(0,1);
    document.body.style.cssText+='position:fixed;width:100%;height:100%;';
    fsBtn.textContent='✕';
    setTimeout(applyScale,80);
  }
}

function exitFS(){
  if(isFS()){
    const ex=document.exitFullscreen||document.webkitExitFullscreen;
    try{ if(ex) ex.call(document); }catch(e){}
  } else if(fakeFS){
    fakeFS=false;
    document.body.style.position='';
    fsBtn.textContent='⛶';
    setTimeout(applyScale,80);
  }
}

// touchend fires synchronously inside gesture — required for mobile fullscreen
fsBtn.addEventListener('touchend',e=>{
  e.preventDefault(); e.stopPropagation();
  isFS()||fakeFS ? exitFS() : enterFS();
},{passive:false});
fsBtn.addEventListener('click',e=>{
  e.stopPropagation();
  isFS()||fakeFS ? exitFS() : enterFS();
});

['fullscreenchange','webkitfullscreenchange','mozfullscreenchange'].forEach(ev=>
  document.addEventListener(ev,()=>{ fsBtn.textContent=isFS()?'✕':'⛶'; setTimeout(applyScale,150); })
);
// Allow ESC key to properly exit fullscreen
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&(isFS()||fakeFS)){ exitFS(); }
});

// ═══════════════════════════════════
//  PALETTE
// ═══════════════════════════════════
const P={
  bg:'#090b0f',fl:'#1c1e2c',fla:'#181a28',
  wall:'#0c0e18',whi:'#232838',trim:'#2a3040',thi:'#363d54',
  door:'#12161e',dfr:'#283040',
  lglo:'#4a6835',lhi:'#7ab050',
  skin:'#c8a87a',
  h1:'#281808',h2:'#7a5028',h3:'#363636',h4:'#c0b898',
  s1:'#3a587a',s2:'#7a3848',s3:'#486838',s4:'#68583a',
  pnt:'#282c38',pntd:'#1c2030',shoe:'#161616',
  psh:'#486848',ph:'#181008',pv:'#30482e',pb:'#c8b89a',
  sofa:'#6a4838',sofad:'#482e1e',sofah:'#8a6040',
  mat:'#c8c0a8',matd:'#a8a090',math:'#e0d8c0',
  fri:'#8898a8',frid:'#687888',frih:'#a8b8c8',
  ch:'#785838',chd:'#583820',chh:'#987858',
  box:'#b8a070',boxd:'#907850',boxh:'#d8c090',
  cpb:'#283818',cps:'#385826',cph:'#587840',cpa:'#7ab050',
  ut:'#c8b89a',ud:'#607050',ua:'#7ab050',uw:'#c87038',ur:'#c84040',ug:'#50a848',
};

// ═══════════════════════════════════
//  CONTENT
// ═══════════════════════════════════
const DLG_INTENT=[
  "This sofa very heavy leh...",
  "Aiyah, where to put ah...",
  "Renovating, need to clear out.",
  "Wah, this fridge so bulky one.",
  "Just put here a while only...",
  "Nobody will notice one lah.",
  "Aiyo, corridor so long sia.",
  "This mattress, cannot carry far.",
  "Wah, lift so far away leh.",
  "Must get rid of this today.",
  "Renovation finish liao, now what?",
  "My back pain, cannot walk far.",
];
const DLG_OK=[
  "OK lah, I go book collection!",
  "Wah, cannot dump here one!",
  "Aiyah, forgot proper way leh.",
  "Sorry bro, my bad sia.",
  "Eh, you very on the ball!",
  "OK can, I call NEA later.",
  "Paiseh, I didn't know!",
  "Roger, I go register now.",
  "Wah lau, got corridor warden!",
  "Steady lah, I go do properly.",
  "OK boss, I hear you loud!",
  "Aiya, cannot simply dump one.",
  "Okok, I go schedule pickup.",
  "Sorry ah, first time renovate.",
  "Eh, thank you for telling me!",
  "My bad lah, I blur blur.",
];
const DLG_BAD=[
  "Aiyah, paiseh lah...",
  "Eh sorry, very heavy one leh.",
  "I thought nobody see one...",
  "Next time I definitely call first.",
  "Cannot tahan already, so heavy.",
  "I owe you a kopi, ok or not?",
  "So sorry, renovating mah.",
  "Alamak, I know I know...",
  "Aiya, just this once lah.",
  "Sorry leh, I very tired today.",
  "Wah, you saw ah? Paiseh...",
  "OK lah I admit, I lazy.",
];
const ITEMS=[
  {name:'sofa',    w:16,h:8, col:P.sofa, dk:P.sofad,hi:P.sofah},
  {name:'mattress',w:14,h:5, col:P.mat,  dk:P.matd, hi:P.math },
  {name:'fridge',  w:8, h:14,col:P.fri,  dk:P.frid, hi:P.frih },
  {name:'chair',   w:9, h:9, col:P.ch,   dk:P.chd,  hi:P.chh  },
  {name:'boxes',   w:10,h:9, col:P.box,  dk:P.boxd, hi:P.boxh },
];
const LOOKS=[
  {shirt:P.s1,hair:P.h1,pants:P.pnt },
  {shirt:P.s2,hair:P.h2,pants:P.pntd},
  {shirt:P.s3,hair:P.h3,pants:P.pnt },
  {shirt:P.s4,hair:P.h4,pants:P.pntd},
];
const FACTS=[
  "Singapore generates 7,600+ tonnes of bulky waste per year.",
  "NEA offers FREE bulky item pickup — book at myenv.nea.gov.sg",
  "Abandoned items in corridors are a fire evacuation hazard.",
  "Good furniture can be donated to Salvation Army or Caritas.",
  "Illegal dumping fines can reach up to $1,000.",
  "Bulky items in common areas attract pests and vermin.",
];
// HUD is now at bottom (y: VH-14 to VH), CP sits in top-right clear of ceiling
const CP={x:208,y:25,w:22,h:15};

// ═══════════════════════════════════
//  STATE
// ═══════════════════════════════════
let state='idle';
let score,blockScore,timeLeft,wave,fc;
let intercepted,missed,spawnT,waveT,ended;
let player,npcs,items,parts,floats;

function initAll(){
  score=0;blockScore=100;timeLeft=90;wave=1;fc=0;
  intercepted=0;missed=0;spawnT=0;waveT=0;ended=false;
  npcs=[];items=[];parts=[];floats=[];
  player={x:120,y:100,speed:55,carry:null,anim:0,face:1};
}
initAll();

// ═══════════════════════════════════
//  INPUT
// ═══════════════════════════════════
const keys={};
let tS=null,tP=null,tTap=null,lastTouch=0;
document.addEventListener('keydown',e=>{
  keys[e.key]=true;
  // Never block Escape (needed for browser fullscreen exit)
  if(e.key!=='Escape') e.preventDefault();
});
document.addEventListener('keyup',  e=>{keys[e.key]=false;});

canvas.addEventListener('touchstart',e=>{
  if(state==='playing') e.preventDefault();
  const t=e.touches[0],r=canvas.getBoundingClientRect();
  const pt={x:(t.clientX-r.left)/SCALE,y:(t.clientY-r.top)/SCALE};
  tS={...pt};tP={...pt};tTap={...pt};
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  if(state==='playing') e.preventDefault();
  const t=e.touches[0],r=canvas.getBoundingClientRect();
  tP={x:(t.clientX-r.left)/SCALE,y:(t.clientY-r.top)/SCALE};
},{passive:false});
canvas.addEventListener('touchend',e=>{
  if(state==='playing') e.preventDefault();
  if(tTap&&tP&&Math.hypot(tP.x-tTap.x,tP.y-tTap.y)<10){
    lastTouch=Date.now(); onTap(tTap.x,tTap.y);
  }
  tS=null;tP=null;tTap=null;
},{passive:false});
canvas.addEventListener('click',e=>{
  if(Date.now()-lastTouch<500)return;
  const r=canvas.getBoundingClientRect();
  onTap((e.clientX-r.left)/SCALE,(e.clientY-r.top)/SCALE);
});

function onTap(vx,vy){
  if(state!=='playing')return;
  // NPC interception is now collision-based only, not tap
  if(player.carry){
    if(inCP(vx,vy))collectCarry();
    return;
  }
  for(const it of items){
    if(!it.held&&Math.hypot(vx-it.x,vy-it.y)<15){
      player.carry=it;it.held=true;return;
    }
  }
}
function inCP(x,y){return x>CP.x-8&&x<CP.x+CP.w+8&&y>CP.y-8&&y<CP.y+CP.h+10;}

// ═══════════════════════════════════
//  GAME LOGIC
// ═══════════════════════════════════
function spawnNPC(){
  const look=LOOKS[Math.random()*LOOKS.length|0];
  const itype={...ITEMS[Math.random()*ITEMS.length|0]};
  const left=Math.random()<0.5;
  const tx=35+Math.random()*150, ty=30+Math.random()*90;
  npcs.push({
    x:left?2:VW-2, y:ty, tx, ty,
    speed:22+Math.random()*10+wave*2,
    look, itype,
    intercepted:false,dropped:false,leaving:false,dead:false,
    anim:Math.random()*6, alpha:0, face:left?1:-1,
    dlg:null, dlgT:0,
    intentShown:false,
    // Show intent line after NPC has walked a bit
    intentDelay:0.8+Math.random()*0.6,
    intentTimer:0,
  });
}

function interceptNPC(n){
  n.intercepted=true;n.leaving=true;
  n.tx=n.face>0?VW+30:-30;
  score+=15;blockScore=Math.min(100,blockScore+5);intercepted++;
  n.dlg=DLG_OK[Math.random()*DLG_OK.length|0];
  n.dlgT=2.8;
  burst(n.x,n.y-8,P.ug,8);
  addFloat(n.x,n.y-18,'+15',P.ua,1.4);
}

function npcDrop(n){
  n.dropped=true;
  items.push({...n.itype,x:n.tx,y:n.ty,held:false});
  blockScore=Math.max(0,blockScore-10);missed++;
  n.dlg=DLG_BAD[Math.random()*DLG_BAD.length|0];
  n.dlgT=2.4;n.leaving=true;
  n.tx=n.face>0?VW+30:-30;
  addFloat(n.tx,n.ty-10,'-10',P.ur,1.5);
  burst(n.tx,n.ty,P.ur,4);
}

function collectCarry(){
  const it=player.carry;
  items=items.filter(i=>i!==it);
  player.carry=null;score+=10;
  burst(CP.x+CP.w/2,CP.y+CP.h/2,P.cpa,10);
  addFloat(CP.x+CP.w/2,CP.y-6,'+10',P.ua,1.5);
}

function burst(x,y,col,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=12+Math.random()*22;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,col,life:0.6+Math.random()*0.3,ml:0.9,sz:1+Math.random()});
  }
}
function addFloat(x,y,txt,col,life){
  floats.push({x,y,txt,col,life,ml:life,vy:-20});
}

// ═══════════════════════════════════
//  UPDATE
// ═══════════════════════════════════
let lastTs=0;
function update(dt){
  fc++;waveT+=dt;spawnT+=dt;
  // Move player
  let dx=0,dy=0;
  if(keys['ArrowLeft']||keys['a'])dx-=1;
  if(keys['ArrowRight']||keys['d'])dx+=1;
  if(keys['ArrowUp']||keys['w'])dy-=1;
  if(keys['ArrowDown']||keys['s'])dy+=1;
  if(tS&&tP){
    const ddx=tP.x-tS.x,ddy=tP.y-tS.y,tm=Math.hypot(ddx,ddy);
    if(tm>6){dx+=ddx/tm;dy+=ddy/tm;}
  }
  if(dx||dy){
    const len=Math.hypot(dx,dy)||1;
    const sp=player.carry?player.speed*0.55:player.speed;
    player.x=Math.max(8,Math.min(VW-8,player.x+dx/len*sp*dt));
    player.y=Math.max(24,Math.min(VH-18,player.y+dy/len*sp*dt));
    player.anim+=dt;
    if(dx>0)player.face=1;else if(dx<0)player.face=-1;
  }
  if(player.carry){
    player.carry.x=player.x; player.carry.y=player.y-14;
    if(inCP(player.x,player.y))collectCarry();
  }
  // NPCs
  for(const n of npcs){
    n.alpha=Math.min(1,n.alpha+dt*4); n.anim+=dt;
    if(n.dlgT>0) n.dlgT-=dt;

    // Intent dialogue — show once after NPC has walked a short while
    if(!n.intentShown&&!n.intercepted&&!n.dropped){
      n.intentTimer+=dt;
      if(n.intentTimer>=n.intentDelay){
        n.intentShown=true;
        n.dlg=DLG_INTENT[Math.random()*DLG_INTENT.length|0];
        n.dlgT=2.0;
      }
    }

    const ddx=n.tx-n.x, ddy=n.ty-n.y, td=Math.hypot(ddx,ddy);
    if(td>2){
      n.x+=ddx/td*n.speed*dt; n.y+=ddy/td*n.speed*dt;
      if(ddx>0.5)n.face=1; else if(ddx<-0.5)n.face=-1;

      // Collision interception — player must physically reach the NPC
      if(!n.intercepted&&!n.dropped){
        const pd=Math.hypot(player.x-n.x, player.y-n.y);
        if(pd<14) interceptNPC(n);
      }
    } else {
      if(n.leaving) n.dead=true;
      else if(!n.dropped&&!n.intercepted) npcDrop(n);
    }
  }
  npcs=npcs.filter(n=>!n.dead);
  const si=Math.max(2.0,5.0-wave*0.4);
  if(spawnT>=si&&npcs.length<3+wave){spawnT=0;spawnNPC();}
  if(waveT>18&&wave<5){wave++;waveT=0;}
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=30*dt;p.life-=dt;}
  parts=parts.filter(p=>p.life>0);
  for(const f of floats){f.y+=f.vy*dt;f.vy*=0.85;f.life-=dt;}
  floats=floats.filter(f=>f.life>0);
  timeLeft-=dt;
  if(timeLeft<=0&&!ended){timeLeft=0;endGame();}
}

// ═══════════════════════════════════
//  DRAW PRIMITIVES
// ═══════════════════════════════════
function dr(x,y,w,h,c){
  ctx.fillStyle=c;
  ctx.fillRect(Math.round(x)*SCALE,Math.round(y)*SCALE,Math.round(w)*SCALE,Math.round(h)*SCALE);
}
function dp(x,y,c,w=1,h=1){
  ctx.fillStyle=c;
  ctx.fillRect(Math.round(x)*SCALE,Math.round(y)*SCALE,w*SCALE,h*SCALE);
}

// ═══════════════════════════════════
//  DRAW BACKGROUND
// ═══════════════════════════════════
function drawBG(){
  dr(0,0,VW,VH,P.bg);
  // Floor tiles (between ceiling and skirting)
  for(let ty=22;ty<VH-20;ty+=8)
    for(let tx=6;tx<VW-6;tx+=8)
      dr(tx,ty,8,8,((tx/8+ty/8)%2===0)?P.fl:P.fla);
  // Walls
  dr(0,0,6,VH,P.wall); dp(5,0,P.whi,1,VH);
  dr(VW-6,0,6,VH,P.wall); dp(VW-7,0,P.whi,1,VH);
  // Ceiling
  dr(6,0,VW-12,22,P.wall);
  dr(6,20,VW-12,2,P.trim);
  dp(6,21,P.thi,VW-12,1);
  // Tube lights
  for(const lx of [40,120,200]){
    dr(lx-14,3,28,5,P.trim);
    dr(lx-13,4,26,3,'#182010');
    dr(lx-12,4,24,1,P.lglo);
    dp(lx-12,4,P.lhi,5,1); dp(lx+6,4,P.lhi,5,1);
    ctx.fillStyle='rgba(80,140,45,0.028)';
    ctx.fillRect((lx-20)*SCALE,9*SCALE,40*SCALE,(VH-29)*SCALE);
    ctx.fillStyle='rgba(80,140,45,0.014)';
    ctx.beginPath();
    ctx.moveTo((lx-12)*SCALE,9*SCALE);
    ctx.lineTo((lx-32)*SCALE,(VH-16)*SCALE);
    ctx.lineTo((lx+32)*SCALE,(VH-16)*SCALE);
    ctx.lineTo((lx+12)*SCALE,9*SCALE);
    ctx.closePath();ctx.fill();
  }
  // Doors bottom (above skirting)
  for(const dx of [60,160]){
    dr(dx,VH-34,18,18,P.door);
    dp(dx,VH-34,1,18,P.dfr); dp(dx+17,VH-34,1,18,P.dfr);
    dp(dx,VH-34,18,1,P.dfr);
    dp(dx+8,VH-28,2,2,'#8898a8');
    dr(dx+3,VH-33,10,3,'#0e1218');
  }
  // Noticeboard
  dr(8,5,18,14,'#182010');
  dp(8,5,18,1,P.cph); dp(8,5,1,14,P.cph);
  dp(11,7,P.cpa); dp(14,7,P.ud); dp(17,7,P.ud);
  dp(11,10,P.ud); dp(14,10,P.cpa); dp(17,10,P.ud);
  dp(11,13,P.ud); dp(14,13,P.ud); dp(17,13,P.cpa);
  // Skirting — sits just above HUD bar
  dr(6,VH-20,VW-12,4,P.trim); dp(6,VH-20,VW-12,1,P.thi);
  // Pipes
  dr(6,24,2,VH-46,P.trim); dr(VW-8,24,2,VH-46,P.trim);
  // Collection point
  drawCP();
}

function drawCP(){
  const {x,y,w,h}=CP;
  dr(x-2,y+h,w+4,4,P.cpb); dp(x-2,y+h,w+4,1,P.cph);
  dr(x,y,w,h,P.cps);
  dp(x,y,w,1,P.cph); dp(x,y,1,h,P.cph);
  dp(x+w-1,y,1,h,P.cph); dp(x,y+h-1,w,1,P.cph);
  const pulse=0.5+0.5*Math.sin(fc*0.1);
  ctx.strokeStyle=`rgba(90,138,64,${0.3+0.5*pulse})`;
  ctx.lineWidth=SCALE;
  ctx.strokeRect((x-1)*SCALE,(y-1)*SCALE,(w+2)*SCALE,(h+2)*SCALE);
  // Arrow down
  const ax=x+w/2|0, ay=y+h/2|0;
  dp(ax-1,ay-2,P.cpa,3,1); dp(ax,ay-1,P.cpa,1,4);
  dp(ax-2,ay+2,P.cpa); dp(ax+2,ay+2,P.cpa);
  // Label
  ctx.fillStyle=P.ud;
  ctx.font=`${SCALE*3}px 'Press Start 2P',monospace`;
  ctx.textAlign='center';
  ctx.textBaseline='alphabetic';
  ctx.fillText('COLLECT',(x+w/2)*SCALE,(y+h+7)*SCALE);
  ctx.fillText('HERE',(x+w/2)*SCALE,(y+h+12)*SCALE);
}

// ═══════════════════════════════════
//  DRAW CHARACTERS
// ═══════════════════════════════════
function drawPlayer(){
  const bx=Math.round(player.x)-4, by=Math.round(player.y)-12;
  const bob=Math.round(Math.sin(player.anim*3)*0.5);
  const leg=Math.sin(player.anim*7);
  const f=player.face;
  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.fillRect((bx+1)*SCALE,(by+14)*SCALE,6*SCALE,2*SCALE);
  // Legs
  dp(bx+2,by+9+bob+(leg>0?1:0),P.pnt);
  dp(bx+4,by+9+bob+(leg<0?1:0),P.pnt);
  dp(bx+2,by+11+bob,P.shoe); dp(bx+4,by+11+bob,P.shoe);
  // Body
  dp(bx+1,by+5+bob,P.psh,6,4);
  dp(bx+2,by+5+bob,P.pv,4,3);
  dp(bx+3,by+5+bob,P.skin); dp(bx+4,by+5+bob,P.skin);
  // Arms
  const sw=player.carry?0:Math.sin(player.anim*7);
  dp(bx+(f>0?1:6),by+6+bob+Math.round(sw),P.psh);
  dp(bx+(f>0?6:1),by+6+bob-Math.round(sw),P.psh);
  // Head
  dp(bx+2,by+2+bob,P.ph,4,1);
  dp(bx+1,by+3+bob,P.ph); dp(bx+2,by+3+bob,P.skin,4,2); dp(bx+6,by+3+bob,P.ph);
  dp(f>0?bx+4:bx+3,by+3+bob,'#181008');
  dp(bx+(f>0?2:4),by+6+bob,P.pb);
  if(player.carry)drawGlyph(player.carry,bx+1,by-7);
}

function drawNPC(n){
  const x=Math.round(n.x), y=Math.round(n.y);
  const bx=x-4, by=y-12;
  const bob=Math.round(Math.sin(n.anim*5)*0.4);
  const leg=Math.sin(n.anim*5);
  const f=n.face;
  ctx.globalAlpha=Math.min(1,n.alpha);
  ctx.fillStyle='rgba(0,0,0,0.2)';
  ctx.fillRect((bx+1)*SCALE,(by+14)*SCALE,6*SCALE,2*SCALE);
  dp(bx+2,by+9+bob+(leg>0?1:0),P.pntd);
  dp(bx+4,by+9+bob+(leg<0?1:0),P.pntd);
  dp(bx+2,by+11+bob,P.shoe); dp(bx+4,by+11+bob,P.shoe);
  dp(bx+1,by+5+bob,n.look.shirt,6,4);
  dp(bx+2,by+7+bob,n.look.pants,4,2);
  dp(bx+3,by+5+bob,P.skin); dp(bx+4,by+5+bob,P.skin);
  if(!n.dropped&&!n.intercepted){
    drawGlyph(n.itype,f>0?bx+6:bx-8,by+2);
    dp(bx+(f>0?6:1),by+6+bob,n.look.shirt);
  }
  dp(bx+2,by+1+bob,n.look.hair,4,2);
  dp(bx+2,by+3+bob,P.skin,4,2);
  dp(bx+1,by+3+bob,n.look.hair);
  dp(f>0?bx+4:bx+3,by+3+bob,'#181008');
  ctx.globalAlpha=1;
  // Speech bubble — drawn AFTER resetting globalAlpha
  if(n.dlg && n.dlgT>0){
    drawBubble(n.dlg, x, by, Math.min(1, n.dlgT*1.2));
  }
}

function drawBubble(text, cx, charTopY, alpha){
  const words=text.split(' ');
  const lines=[];
  let cur='';
  for(const w of words){
    if(cur.length&&(cur+' '+w).length>12){lines.push(cur);cur=w;}
    else cur=(cur?cur+' ':'')+w;
  }
  if(cur)lines.push(cur);
  const L=Math.min(lines.length,2);
  const lineH=7, pad=4;
  const maxLen=Math.max(...lines.slice(0,L).map(l=>l.length));
  const bw=maxLen*5+pad*2;
  const bh=L*lineH+pad;
  const bx=cx-bw/2;
  const by=charTopY-bh-6; // above the character's head

  ctx.globalAlpha=alpha;
  // Background
  dr(bx,by,bw,bh,'#ddd0b0');
  // Border
  dp(bx,by,bw,1,'#a89868'); dp(bx,by+bh-1,bw,1,'#a89868');
  dp(bx,by,1,bh,'#a89868'); dp(bx+bw-1,by,1,bh,'#a89868');
  // Tail
  dp(cx-1,by+bh,'#ddd0b0',2,2);
  dp(cx,by+bh+2,'#ddd0b0',1,1);
  // Text
  ctx.fillStyle='#2a2010';
  ctx.font=`${Math.max(2,SCALE)*3}px 'Press Start 2P',monospace`;
  ctx.textAlign='center';
  ctx.textBaseline='alphabetic';
  for(let i=0;i<L;i++){
    ctx.fillText(lines[i], cx*SCALE, (by+pad+5+i*lineH)*SCALE);
  }
  ctx.globalAlpha=1;
}

function drawGlyph(it,bx,by){
  const iw=Math.min(it.w,11),ih=Math.min(it.h,10);
  dr(bx,by,iw,ih,it.col);
  dr(bx,by,iw,1,it.hi); dr(bx,by,1,ih,it.hi);
  dr(bx,by+ih-1,iw,1,it.dk); dr(bx+iw-1,by,1,ih,it.dk);
}

function drawItem(it){
  const x=Math.round(it.x-it.w/2), y=Math.round(it.y-it.h/2);
  dr(x,y,it.w,it.h,it.col);
  dr(x,y,it.w,1,it.hi); dr(x,y,1,it.h,it.hi);
  dr(x,y+it.h-1,it.w,1,it.dk); dr(x+it.w-1,y,1,it.h,it.dk);
  if(it.name==='sofa'){dr(x+1,y+1,it.w-2,3,it.hi);}
  else if(it.name==='fridge'){dp(x+2,y+2,it.hi,it.w-4,1);dp(x+it.w-2,y+4,'#607888');}
  else if(it.name==='boxes'){dp(x+(it.w/2|0),y+1,it.dk,1,it.h-2);dp(x+1,y+(it.h/2|0),it.dk,it.w-2,1);}
  ctx.strokeStyle='rgba(200,60,40,0.6)';
  ctx.lineWidth=SCALE;
  ctx.strokeRect((x-1)*SCALE,(y-1)*SCALE,(it.w+2)*SCALE,(it.h+2)*SCALE);
}

// ═══════════════════════════════════
//  HUD  (bottom bar)
// ═══════════════════════════════════
function drawHUD(){
  const hudY = VH-14;
  dr(6,hudY,VW-12,14,'rgba(6,8,9,0.88)');
  // Cleanliness bar
  const bw=60,bx=8,by=hudY+3;
  dr(bx,by,bw,5,'#181c28');
  const fw=Math.round(bw*blockScore/100);
  dr(bx,by,fw,5,blockScore>60?P.ua:blockScore>30?P.uw:P.ur);
  dp(bx,by,bw,1,P.trim);
  ctx.fillStyle=P.ud; ctx.font=`${SCALE*2.8}px 'Press Start 2P',monospace`;
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  ctx.fillText('BLOCK',bx*SCALE,(by+9)*SCALE);
  // Timer
  ctx.fillStyle=timeLeft>20?P.ud:P.ur;
  ctx.font=`${SCALE*4}px 'Press Start 2P',monospace`; ctx.textAlign='center';
  ctx.fillText(`${Math.ceil(timeLeft)}s`,(VW/2)*SCALE,(hudY+11)*SCALE);
  // Wave
  ctx.fillStyle=P.ud; ctx.font=`${SCALE*3}px 'Press Start 2P',monospace`;
  ctx.fillText(`W${wave}/5`,((VW/2)+38)*SCALE,(hudY+10)*SCALE);
  // Score
  ctx.fillStyle=P.ut; ctx.font=`${SCALE*4.5}px 'Press Start 2P',monospace`; ctx.textAlign='right';
  ctx.fillText(String(score),(VW-8)*SCALE,(hudY+11)*SCALE);
  // Hint
  if(fc<300&&npcs.length===0&&items.length===0){
    ctx.globalAlpha=0.4+0.3*Math.sin(fc*0.06);
    ctx.fillStyle=P.ud; ctx.font=`${SCALE*3.5}px 'Press Start 2P',monospace`; ctx.textAlign='center';
    ctx.fillText('WALK INTO a neighbour to intercept',(VW/2)*SCALE,(VH/2+10)*SCALE);
    ctx.fillText('TAP fallen item · carry to COLLECT POINT',(VW/2)*SCALE,(VH/2+20)*SCALE);
    ctx.globalAlpha=1;
  }
}

// ═══════════════════════════════════
//  RENDER
// ═══════════════════════════════════
function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawBG();
  for(const it of items)if(!it.held)drawItem(it);
  const all=[{ip:true,y:player.y},...npcs.map(n=>({ip:false,n,y:n.y}))].sort((a,b)=>a.y-b.y);
  for(const e of all){ if(e.ip)drawPlayer(); else drawNPC(e.n); }
  // Particles
  for(const p of parts){
    ctx.globalAlpha=p.life/p.ml;
    ctx.fillStyle=p.col;
    ctx.fillRect(Math.round(p.x)*SCALE,Math.round(p.y)*SCALE,Math.ceil(p.sz)*SCALE,Math.ceil(p.sz)*SCALE);
  }
  ctx.globalAlpha=1;
  // Floats
  ctx.textBaseline='alphabetic';
  for(const f of floats){
    ctx.globalAlpha=Math.min(1,f.life*2);
    ctx.fillStyle=f.col;
    ctx.font=`bold ${4*SCALE}px 'Press Start 2P',monospace`; ctx.textAlign='center';
    ctx.fillText(f.txt,Math.round(f.x)*SCALE,Math.round(f.y)*SCALE);
  }
  ctx.globalAlpha=1;
  if(state==='playing')drawHUD();
}

// ═══════════════════════════════════
//  END GAME
// ═══════════════════════════════════
function endGame(){
  if(ended)return; ended=true; state='end';
  if(player.carry){player.carry.held=false;player.carry=null;}
  const grade=blockScore>=80?'EXCELLENT':blockScore>=50?'ADEQUATE':'NEEDS WORK';
  const gc=blockScore>=80?'#7ab050':blockScore>=50?'#c8b89a':'#c84040';
  document.getElementById('endTitle').textContent=`LEVEL 1 COMPLETE · ${grade}`;
  document.getElementById('endTitle').style.color=gc;
  document.getElementById('endStats').innerHTML=
    `Score <span>${score}</span> &nbsp;·&nbsp; `+
    `Intercepted <span>${intercepted}</span> &nbsp;·&nbsp; `+
    `Missed <span>${missed}</span><br>`+
    `Block cleanliness <span style="color:${gc}">${blockScore}%</span>`;
  document.getElementById('endFact').textContent=FACTS[Math.random()*FACTS.length|0];
  const hi=parseInt(localStorage.getItem('bb_hi')||'0');
  if(score>hi){localStorage.setItem('bb_hi',score);document.getElementById('hiScore').textContent='🏆 NEW HIGH SCORE!';}
  else document.getElementById('hiScore').textContent=`Best: ${hi}`;
  document.getElementById('endScreen').style.display='flex';
}

// ═══════════════════════════════════
//  LOOP & INIT
// ═══════════════════════════════════
function loop(ts){
  const dt=Math.min((ts-lastTs)/1000,0.05);
  lastTs=ts;
  if(state==='playing')update(dt);
  render();
  requestAnimationFrame(loop);
}
function addBtnListeners(id, fn){
  const el=document.getElementById(id);
  el.addEventListener('click', fn);
  el.addEventListener('touchend', e=>{ e.preventDefault(); fn(); },{passive:false});
}
addBtnListeners('startBtn',()=>{
  document.getElementById('titleScreen').style.display='none';
  initAll(); state='playing';
});
addBtnListeners('restartBtn',()=>{
  document.getElementById('endScreen').style.display='none';
  // Show title screen again
  const ts=document.getElementById('titleScreen');
  ts.style.display='';  // restore (was set to none on first start)
  state='idle';
});
render();
requestAnimationFrame(ts=>{lastTs=ts;requestAnimationFrame(loop);});
</script>
</body>
