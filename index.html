<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#14202a">
<title>Block Patrol: Bulky Rescue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; background:#14202a; overflow:hidden; touch-action:none; font-family:'Press Start 2P',monospace; }
:fullscreen, :-webkit-full-screen { padding:0!important; margin:0!important; }
#wrapper { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#14202a; overflow:hidden; }
#gameCanvas { display:block; position:absolute; image-rendering:pixelated; image-rendering:crisp-edges; }
body, button { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
/* ── Game & Watch style touch pads ── */
.pad { position:absolute; display:none; gap:var(--g); z-index:15; align-items:flex-end; }
.pad.on { display:flex; }
.pbtnx { width:var(--b); height:var(--b); border-radius:22%; border:max(3px,calc(var(--b)*0.05)) solid #2a1a10; background:#d9473a;
  box-shadow:inset 0 calc(var(--b)*-0.08) 0 #a8322a, inset 0 calc(var(--b)*0.06) 0 #ee6a5a, 0 calc(var(--b)*0.07) 0 #2a1a10;
  display:flex; align-items:center; justify-content:center; touch-action:none; cursor:pointer; padding:0; }
.pbtnx svg { width:46%; height:46%; image-rendering:pixelated; }
.pbtnx.down { transform:translateY(calc(var(--b)*0.06)); box-shadow:inset 0 calc(var(--b)*0.06) 0 #a8322a, 0 calc(var(--b)*0.01) 0 #2a1a10; background:#c23a2e; }
.pbtnx.lift { background:#2a8fc8; box-shadow:inset 0 calc(var(--b)*-0.08) 0 #1d6a98, inset 0 calc(var(--b)*0.06) 0 #5ab0e0, 0 calc(var(--b)*0.07) 0 #2a1a10; }
.pbtnx.lift.down { background:#2380b6; box-shadow:inset 0 calc(var(--b)*0.06) 0 #1d6a98, 0 calc(var(--b)*0.01) 0 #2a1a10; }
.padcol { display:flex; flex-direction:column; align-items:center; gap:var(--g); }
#rotate { display:none; position:absolute; inset:0; z-index:50; background:#16324a; color:#fff4d6; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:18px; font-size:11px; line-height:1.8; padding:24px; }
#rotate .ph { width:44px; height:76px; border:4px solid #fff4d6; border-radius:8px; animation:rot 2s ease-in-out infinite; }
@keyframes rot { 0%,30% { transform:rotate(0); } 60%,100% { transform:rotate(-90deg); } }
.padlbl { font-size:max(7px,calc(var(--b)*0.13)); color:#8ecdf6; letter-spacing:1px; }
.overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:20; }
#titleScreen { transition:opacity .35s ease; }
#titleBg { transition:transform 1.15s cubic-bezier(.55,0,.85,.35); transform-origin:19% 52%; }
#titleContent { transition:opacity .35s ease; }
#titleScreen.zooming #titleBg { transform:scale(3.4); }
#titleScreen.zooming #titleContent { opacity:0; }
#titleScreen.fading { opacity:0; }
#muteBtn { position:absolute; top:10px; right:48px; background:rgba(255,244,214,0.85); border:2px solid #2a1a10; color:#2a1a10; width:30px; height:30px; font-size:14px; cursor:pointer; z-index:40; display:flex; align-items:center; justify-content:center; padding:0; touch-action:manipulation; }
#fsBtn { position:absolute; top:10px; right:10px; background:rgba(255,244,214,0.85); border:2px solid #2a1a10; color:#2a1a10; width:30px; height:30px; font-size:15px; cursor:pointer; z-index:40; display:flex; align-items:center; justify-content:center; line-height:1; }

/* ── title screen ── */
.tshade { position:absolute; inset:0; background:linear-gradient(to bottom,rgba(10,30,60,.38) 0%,rgba(10,30,60,0) 38%,rgba(0,0,0,0) 72%,rgba(10,10,20,.5) 100%); }
#logo { position:absolute; top:7%; left:50%; transform:translateX(-50%); text-align:center; white-space:nowrap; animation:logoIn .7s cubic-bezier(.2,1.4,.4,1) both; }
#logoMain { font-size:clamp(30px,7.4vw,96px); color:#ffe878; line-height:1; letter-spacing:.02em;
  text-shadow:.05em 0 #2a1a10,-.05em 0 #2a1a10,0 .05em #2a1a10,0 -.05em #2a1a10,.05em .05em #2a1a10,-.05em .05em #2a1a10,.05em -.05em #2a1a10,-.05em -.05em #2a1a10,
    0 .12em #e8743b,.05em .12em #e8743b,-.05em .12em #e8743b,0 .17em #2a1a10,.05em .17em #2a1a10,-.05em .17em #2a1a10; animation:bob 2.6s ease-in-out infinite; }
#ribbon { position:relative; display:inline-block; margin-top:.9em; font-size:clamp(11px,2.3vw,30px); color:#fff4d6; background:#d9473a; padding:.5em 1.3em .45em;
  border:.14em solid #2a1a10; box-shadow:0 .22em 0 #2a1a10; transform:rotate(-3deg); text-shadow:.1em .1em 0 #a8322a; }
#ribbon::before, #ribbon::after { content:''; position:absolute; top:.35em; width:1.1em; height:100%; background:#a8322a; border:.14em solid #2a1a10; z-index:-1; }
#ribbon::before { left:-.9em; clip-path:polygon(0 0,100% 0,100% 100%,0 100%,35% 50%); }
#ribbon::after { right:-.9em; clip-path:polygon(0 0,100% 0,65% 50%,100% 100%,0 100%); }
#startBtn { position:absolute; bottom:2.5%; left:50%; transform:translateX(-50%); background:none; border:none; cursor:pointer; font-family:'Press Start 2P',monospace;
  font-size:clamp(12px,2.2vw,26px); color:#fff4d6; letter-spacing:.08em; padding:1em 2em;
  text-shadow:.12em 0 #2a1a10,-.12em 0 #2a1a10,0 .12em #2a1a10,0 -.12em #2a1a10,.12em .12em #2a1a10; animation:blink 1.1s steps(2,jump-none) infinite; }
#hiT { position:absolute; top:3%; left:3%; font-size:clamp(8px,1.2vw,14px); color:#fff4d6; text-shadow:2px 2px 0 #2a1a10; }
@keyframes blink { 0% { opacity:1; } 100% { opacity:.15; } }
@keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-.06em); } }
@keyframes logoIn { from { transform:translate(-50%,-40%) scale(.6); opacity:0; } to { transform:translate(-50%,0) scale(1); opacity:1; } }
/* ── results buttons (sit on the dirt strip of the canvas) ── */
#endBtns { position:absolute; display:none; justify-content:center; align-items:center; gap:.8em; z-index:30; }
#endBtns.on { display:flex; animation:pop .4s cubic-bezier(.2,1.5,.4,1) both; }
.ebtn { font-family:'Press Start 2P',monospace; font-size:inherit; cursor:pointer; border:.22em solid #2a1a10; padding:.85em 1.3em; box-shadow:0 .3em 0 #2a1a10; touch-action:manipulation; }
.ebtn:active { transform:translateY(.22em); box-shadow:0 .08em 0 #2a1a10; }
#pledgeBtn { background:#ffe878; color:#2a1a10; animation:pp 1.1s ease-in-out infinite; }
#pledgeBtn.share { background:#4cb3ee; color:#fff; animation:none; }
#lb { position:absolute; display:none; z-index:40; background:radial-gradient(ellipse at center,rgba(20,40,80,.9),rgba(6,10,22,.95)); align-items:center; justify-content:center; font-family:'Press Start 2P',monospace; }
#lb.on { display:flex; }
#lbPanel { position:relative; width:84%; max-height:97%; padding:.8em 1.2em 1em; text-align:center; color:#e8f4ff; background:linear-gradient(#10224a,#0a1430); border:.22em solid #4cf4ff; box-shadow:0 0 .9em #2ad4ff, inset 0 0 1.2em rgba(76,244,255,.25), 0 .4em 0 #02060f; overflow:hidden; }
#lbPanel::after { content:''; position:absolute; inset:0; pointer-events:none; background:repeating-linear-gradient(0deg,rgba(255,255,255,.045) 0 2px,transparent 2px 4px); }
#lbTitle { font-size:1.25em; color:#ffe878; text-shadow:0 0 .5em #ffb020,.1em .1em 0 #7a3a00; letter-spacing:.05em; animation:lbPulse 1.6s ease-in-out infinite; }
@keyframes lbPulse { 50% { text-shadow:0 0 1em #ffd23a,.1em .1em 0 #7a3a00; } }
#lbDate { display:block; font-size:.55em; color:#7fb8e8; margin:.5em 0 .7em; letter-spacing:.1em; }
.lbHead,.lbRow { display:grid; grid-template-columns:2.6em 1fr 8.5em 6.2em; gap:.9em; align-items:center; text-align:left; padding:.3em .5em; }
.lbHead { font-size:.6em; color:#7fb8e8; border-bottom:.12em solid #2a4a8a; }
.lbHead span:nth-child(3),.lbHead span:nth-child(4) { text-align:right; }
.lbRow { font-size:.95em; border-bottom:.1em dashed rgba(127,184,232,.25); opacity:0; animation:lbIn .35s ease-out forwards; }
@keyframes lbIn { from { transform:translateX(-2em); opacity:0; } to { transform:none; opacity:1; } }
.lbRow .rk { text-align:center; }
.lbRow.r1 { color:#ffe878; text-shadow:0 0 .45em #ffb020; } .lbRow.r2 { color:#dfe9f5; } .lbRow.r3 { color:#f2b27a; }
.lbRow .cl { display:flex; align-items:center; gap:.5em; justify-content:flex-end; font-size:.7em; }
.cl u { display:block; width:4.2em; height:.75em; background:#13254f; border:.1em solid #2a4a8a; text-decoration:none; }
.cl i { display:block; height:100%; }
.lbRow .sc { text-align:right; color:#fff; font-size:1.05em; }
.lbRow.me { color:#ffe878; background:rgba(255,232,120,.32); animation:lbIn .35s ease-out forwards, lbGlow .9s steps(2) .4s infinite; }
@keyframes lbGlow { 50% { background:rgba(255,232,120,.55); } }
.lbRow.empty { opacity:.35; }
#lbNext { font-size:.68em; margin:.8em 0 .2em; color:#7fe8ff; min-height:1.4em; }
#lbNext.blink { animation:lbBlink 1s steps(2) infinite; } @keyframes lbBlink { 50% { opacity:.2; } }
#lbThanks { display:none; align-items:center; gap:1em; text-align:left; margin:.5em 0 .7em; }
#lbThanks.on { display:flex; animation:thxIn .6s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes thxIn { from { opacity:0; transform:translateY(-.8em) scale(.92); } to { opacity:1; transform:none; } }
#lbPic { width:5.6em; height:5.6em; flex:none; image-rendering:pixelated; border:.14em solid #ffe878; background:#16306a; box-shadow:0 0 .8em rgba(255,224,120,.55); animation:thxBob 1.8s ease-in-out infinite; }
@keyframes thxBob { 50% { transform:translateY(-.25em); } }
#lbBubble { position:relative; flex:1; padding:.7em .9em; background:#fff8e4; color:#1b2a44; border:.14em solid #ffe878; border-radius:.4em; box-shadow:0 0 .8em rgba(255,224,120,.35); }
#lbBubble::before { content:''; position:absolute; left:-.55em; top:1.6em; border:.5em solid transparent; border-right-color:#ffe878; border-left:0; }
#lbHead2 { font-size:.74em; color:#d9732a; letter-spacing:.04em; margin-bottom:.45em; }
#lbNote { font-size:.8em; line-height:1.55; min-height:3.1em; }
#lbNote b { color:#d9732a; font-weight:normal; }
#lbHelped { display:flex; align-items:center; gap:.3em; margin-top:.5em; font-size:.5em; color:#6a5a3a; flex-wrap:wrap; }
#lbHelped canvas { width:2.4em; height:2.4em; image-rendering:pixelated; border:.1em solid #c9b27a; background:#e8f4ff; }
@media (max-height:430px){ #lbPic{ width:3.6em; height:3.6em; } #lbBubble{ padding:.4em .6em; } #lbNote{ min-height:0; font-size:.66em; } #lbHelped{ display:none; } #lbPanel.entry #lbThanks{ margin:.2em 0 .3em; } }
#lbTip { font-size:.55em; color:#9fd0f0; margin-top:.7em; line-height:1.6; }
#lbFoot { font-size:.5em; color:#5a78a8; margin-top:.4em; letter-spacing:.08em; }
#lbPanel.entry #lbClose { display:none; }
#lbEntry { display:none; } #lbPanel.entry #lbEntry { display:block; } #lbPanel.entry #lbView { display:none; }
#lbBadge { font-size:2em; color:#ffe878; text-shadow:0 0 .5em #ffb020,.08em .08em 0 #7a3a00; margin:.3em 0; }
#lbYou { font-size:.8em; color:#7fe8ff; margin:.2em 0 .8em; }
#lbName { font-size:1.6em; letter-spacing:.25em; min-height:1.6em; min-width:7.5em; display:inline-block; border-bottom:.12em solid #4cf4ff; color:#fff; margin-bottom:.6em; }
#lbKeys { display:grid; grid-template-columns:repeat(9,1fr); gap:.3em; margin:0 auto; max-width:30em; }
#lbKeys button { font-family:inherit; font-size:.95em; padding:.55em 0; background:#16306a; color:#e8f4ff; border:.14em solid #4cf4ff; box-shadow:0 .2em 0 #02060f; cursor:pointer; touch-action:manipulation; }
#lbKeys button:active { transform:translateY(.15em); box-shadow:none; }
#lbKeys .wide { grid-column:span 2; background:#6a1a3a; border-color:#ff8ab0; } #lbKeys .ok { grid-column:span 3; background:#1f9a4a; color:#fff; border-color:#8effa8; }
#lbClose { background:#ffe878; color:#2a1a10; margin-top:.7em; padding:.55em 1.8em; }
#againBtn { background:#fff4d6; color:#2a1a10; }
#shareMsg { position:absolute; bottom:calc(100% + .6em); left:0; right:0; text-align:center; color:#fff4d6; font-size:.8em; text-shadow:2px 2px 0 #2a1a10; }
@keyframes pp { 0%,100% { transform:scale(1); } 50% { transform:scale(1.06); } }
@keyframes pop { from { transform:scale(.6); opacity:0; } to { transform:scale(1); opacity:1; } }
/* tutorial: glowing pad button */
.pbtnx.hint { outline:max(3px,calc(var(--b)*0.06)) solid #ffe878; outline-offset:max(2px,calc(var(--b)*0.04)); animation:glow .6s ease-in-out infinite alternate; }
@keyframes glow { from { outline-color:#ffe878; } to { outline-color:rgba(255,232,120,.15); } }
</style></style>
</head>

<script>
// ═════════════════════════════════════════════
//  CANVAS  — virtual 320×180
// ═════════════════════════════════════════════
const VW=320, VH=180;
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const buf=document.createElement('canvas'); buf.width=VW; buf.height=VH;
const b=buf.getContext('2d');
let SCALE=1;
function isFS(){ return !!(document.fullscreenElement||document.webkitFullscreenElement); }
const qs=new URLSearchParams(location.search);
const TOUCH_UI=qs.has('pad')?qs.get('pad')!=='0':(navigator.maxTouchPoints>0||'ontouchstart' in window||matchMedia('(pointer:coarse)').matches);
let LAYOUT='none', ROTATE=false;
function applyScale(){
  const vv=window.visualViewport;
  const vw=vv?vv.width:window.innerWidth, vh=vv?vv.height:window.innerHeight;
  const padL=document.getElementById('padL'), padR=document.getElementById('padR');
  let fit, cx, cy;
  if(TOUCH_UI){
    const B=Math.round(Math.max(52,Math.min(132,Math.min(vw,vh)*0.15))), G=Math.round(B*0.2);
    document.documentElement.style.setProperty('--b',B+'px'); document.documentElement.style.setProperty('--g',G+'px');
    const lblH=Math.max(10,B*0.2);
    // A: side columns  (left ◀▶ side by side, right ▲/▼ stacked)
    const leftW=2*B+3*G, rightW=B+2*G, fitA=Math.min((vw-leftW-rightW)/VW,vh/VH);
    // B: bottom strip (needs room for the stacked lift buttons too, so put ▲▼ side by side)
    const stripH=B+2*G+B*0.08, fitB=Math.min(vw/VW,(vh-stripH)/VH);
    if(fitA>=fitB){ LAYOUT='side'; fit=fitA; const w=VW*fit;
      cx=leftW+((vw-leftW-rightW)-w)/2; cy=(vh-VH*fit)/2;
      document.getElementById('liftCol').style.flexDirection='column';
      Object.assign(padL.style,{left:G+'px',bottom:(G+B*0.1)+'px',top:'',right:''}); Object.assign(padR.style,{right:G+'px',bottom:(G+B*0.1)+'px',top:'',left:''});
    } else { LAYOUT='bottom'; fit=fitB; const w=VW*fit, h=VH*fit;
      cx=(vw-w)/2; cy=Math.max(0,(vh-stripH-h)/2);
      document.getElementById('liftCol').style.flexDirection='row';
      const by=Math.max(G, vh-cy-h-stripH+G);
      Object.assign(padL.style,{left:Math.max(G,cx)+'px',bottom:G+'px',top:'',right:''}); Object.assign(padR.style,{right:Math.max(G,vw-cx-w)+'px',bottom:G+'px',top:'',left:''});
    }
  } else { LAYOUT='none'; fit=Math.min(vw/VW,vh/VH); cx=(vw-VW*fit)/2; cy=(vh-VH*fit)/2; }
  ROTATE=TOUCH_UI&&vh>vw&&vw<700;
  document.getElementById('rotate').style.display=ROTATE?'flex':'none';
  SCALE=Math.max(1,Math.min(8,Math.floor(fit)||1));
  canvas.width=VW*SCALE; canvas.height=VH*SCALE;
  canvas.style.width=Math.floor(VW*fit)+'px'; canvas.style.height=Math.floor(VH*fit)+'px';
  canvas.style.left=Math.floor(cx)+'px'; canvas.style.top=Math.floor(cy)+'px';
  const eb=document.getElementById('endBtns');
  Object.assign(eb.style,{left:Math.floor(cx)+'px',width:Math.floor(VW*fit)+'px',top:Math.floor(cy+fit*163)+'px',height:Math.floor(fit*16)+'px',fontSize:Math.max(9,fit*5.2)+'px'});
  const lb=document.getElementById('lb'); Object.assign(lb.style,{left:Math.floor(cx)+'px',width:Math.floor(VW*fit)+'px',top:Math.floor(cy)+'px',height:Math.floor(VH*fit)+'px',fontSize:Math.max(8,fit*4.6)+'px'});
  ctx.imageSmoothingEnabled=false;
}
applyScale();
window.addEventListener('resize',applyScale);
if(window.visualViewport) window.visualViewport.addEventListener('resize',applyScale);

const fsBtn=document.getElementById('fsBtn');
let fakeFS=false;
function enterFS(){ const el=document.documentElement, req=el.requestFullscreen||el.webkitRequestFullscreen;
  if(req){ try{ const r=req.call(el); if(r&&r.catch) r.catch(()=>{}); }catch(e){} } else { fakeFS=true; window.scrollTo(0,1); document.body.style.position='fixed'; fsBtn.textContent='✕'; setTimeout(applyScale,80); } }
function exitFS(){ if(isFS()){ const ex=document.exitFullscreen||document.webkitExitFullscreen; try{ if(ex) ex.call(document); }catch(e){} }
  else if(fakeFS){ fakeFS=false; document.body.style.position=''; fsBtn.textContent='⛶'; setTimeout(applyScale,80); } }
fsBtn.addEventListener('touchend',e=>{ e.preventDefault(); e.stopPropagation(); (isFS()||fakeFS)?exitFS():enterFS(); },{passive:false});
fsBtn.addEventListener('click',e=>{ e.stopPropagation(); (isFS()||fakeFS)?exitFS():enterFS(); });

// ═════════════════════════════════════════════
//  PIXEL HELPERS
// ═════════════════════════════════════════════
function R(g,x,y,w,h,c){ g.fillStyle=c; g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
function disc(g,cx,cy,r,c){ for(let dy=-r;dy<=r;dy++){ const w=Math.floor(Math.sqrt(r*r-dy*dy)+0.5); R(g,cx-w,cy+dy,w*2+1,1,c);} }
function ring(g,cx,cy,r,c){ const n=Math.ceil(r*7); for(let i=0;i<n;i++){ const a=i/n*Math.PI*2; R(g,Math.round(cx+Math.cos(a)*r),Math.round(cy+Math.sin(a)*r),1,1,c);} }
function line(g,x0,y0,x1,y1,c){ x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1; let e=dx+dy;
  for(;;){ R(g,x0,y0,1,1,c); if(x0===x1&&y0===y1)break; const e2=2*e; if(e2>=dy){e+=dy;x0+=sx;} if(e2<=dx){e+=dx;y0+=sy;} } }
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function layer(w,h){ const c=document.createElement('canvas'); c.width=w||VW; c.height=h||VH; return c; }
function bush(g,cx,cy,r,rand){
  disc(g,cx,cy+1,r,C.g1); disc(g,cx,cy,r-1,C.g2);
  disc(g,cx-Math.round(r/4),cy-Math.round(r/4),Math.max(1,r-3),C.g3);
  disc(g,cx-Math.round(r/2.5),cy-Math.round(r/2.2),Math.max(1,Math.round(r/3)),C.g4);
  for(let i=0;i<r;i++) R(g,cx-r+rand()*r*2,cy-r+rand()*r*2,1,1,rand()<0.5?C.g1:C.g4);
}
function cloud(g,x,y,s){
  const parts=[[0,0,3],[5,-3,5],[11,-1,4],[16,1,3]];
  for(const [dx,dy,r] of parts) disc(g,x+dx*s,y+dy*s+1,r*s,C.cloudS);
  R(g,x-2*s,y+1*s,21*s,3*s,C.cloudS);
  for(const [dx,dy,r] of parts) disc(g,x+dx*s,y+dy*s,r*s,C.cloud);
  R(g,x-2*s,y,21*s,3*s,C.cloud);
}
function outlineCanvas(src,col){
  const w=src.width+2,h=src.height+2, out=layer(w,h), g=out.getContext('2d');
  const d=src.getContext('2d').getImageData(0,0,src.width,src.height).data;
  const op=(x,y)=>x>=0&&y>=0&&x<src.width&&y<src.height&&d[(y*src.width+x)*4+3]>0;
  g.fillStyle=col;
  for(let y=-1;y<=src.height;y++) for(let x=-1;x<=src.width;x++)
    if(!op(x,y)&&(op(x-1,y)||op(x+1,y)||op(x,y-1)||op(x,y+1))) g.fillRect(x+1,y+1,1,1);
  g.drawImage(src,1,1); return out;
}
function flip(c){ const f=layer(c.width,c.height), g=f.getContext('2d'); g.translate(c.width,0); g.scale(-1,1); g.drawImage(c,0,0); return f; }

function buildSky(){
  const g=L_SKY.getContext('2d'), bands=C.sky, bh=Math.ceil(150/bands.length);
  bands.forEach((c,i)=>{ R(g,0,i*bh,VW,bh,c); if(i>0) for(let x=0;x<VW;x+=2) R(g,x+((i%2)?1:0),i*bh,1,1,bands[i-1]); });
  R(g,0,150,VW,30,bands[bands.length-1]);
  const sx=300, sy=20;
  for(let i=0;i<8;i++){ const a=i/8*Math.PI*2; R(g,Math.round(sx+Math.cos(a)*11)-1,Math.round(sy+Math.sin(a)*11)-1,2,2,C.sunR); }
  disc(g,sx,sy,8,C.sunR); disc(g,sx,sy,7,C.sun); disc(g,sx-2,sy-2,3,'#ffe27a');
  R(g,sx-3,sy-2,1,2,C.sunF); R(g,sx+2,sy-2,1,2,C.sunF);
  R(g,sx-2,sy+2,1,1,C.sunF); R(g,sx-1,sy+3,3,1,C.sunF); R(g,sx+2,sy+2,1,1,C.sunF);
  R(g,sx-5,sy+1,2,1,C.cheek); R(g,sx+4,sy+1,2,1,C.cheek);
}
function drawSkyline(g,ox,base){ // MBS + supertrees + Flyer, hazy
  for(const [x,h] of [[ox+14,58],[ox+26,46],[ox+6,40]]){
    R(g,x-1,base-h,3,h,C.st); R(g,x,base-h,1,h,C.stD);
    for(let k=0;k<4;k++) R(g,x-6+k,base-h-k+1,13-k*2,1,C.st);
    R(g,x-7,base-h+1,15,1,C.stD);
  }
  for(const tx of [ox+38,ox+56,ox+74]){ R(g,tx,base-86,12,86,C.haze1); R(g,tx+9,base-86,3,86,C.haze2);
    for(let y=base-80;y<base-4;y+=4) for(let x=tx+2;x<tx+9;x+=3) R(g,x,y,1,2,C.haze3); }
  R(g,ox+32,base-92,60,5,C.haze2); R(g,ox+32,base-92,60,1,C.haze3);
  for(let x=ox+36;x<ox+88;x+=4) R(g,x,base-94,3,2,C.hazeG);
  const fx=ox+102, fy=base-54;
  ring(g,fx,fy,22,C.haze2); ring(g,fx,fy,21,C.haze3);
  for(let i=0;i<12;i++){ const a=i/12*Math.PI*2; line(g,fx,fy,fx+Math.cos(a)*21,fy+Math.sin(a)*21,C.haze3); R(g,Math.round(fx+Math.cos(a)*22)-1,Math.round(fy+Math.sin(a)*22)-1,2,2,C.haze2); }
  line(g,fx,fy,fx-9,base,C.haze2); line(g,fx,fy,fx+9,base,C.haze2);
}

function drawStationSigns(g){  // the painted cart / bin / shelf get an icon sign on a post
  for(const st of STATIONS){ const x=st.x, y=st.sy;
    R(g,x,y+14,1,st.top-(y+14),'#6a707a');
    R(g,x-7,y-1,15,15,C.ink); R(g,x-6,y,13,13,C.white); R(g,x-6,y+12,13,1,C.wallS);
    ICON[st.key](g,x-5,y+1); }
}
function buildBack(){
  const g=L_BACK.getContext('2d'); g.clearRect(0,0,VW,VH);
  if(HDB_IMG.complete&&HDB_IMG.naturalWidth){ g.drawImage(HDB_IMG,0,0);
    const t=TINTS[Math.max(0,DAYS.indexOf(TH))];
    if(t){ g.globalCompositeOperation='source-atop'; g.fillStyle=t; g.fillRect(0,0,VW,VH); g.globalCompositeOperation='source-over'; } }
  drawStationSigns(g);
}

  const g=L_FACADE.getContext('2d'); g.clearRect(0,0,VW,VH);
  const RED='#f84c32', REDL='#ff7a5e', REDD='#c8321e', W=BX1, bt=FL[1]+4;
  R(g,0,20,W,bt-20,C.wall);
  R(g,0,20,W,4,RED); R(g,0,20,W,1,REDL); R(g,0,23,W,1,REDD);
  for(let k=1;k<=3;k++){ const top=(k===3?24:FL[k+1]+4), bot=FL[k];

      R(g,x-1,bot-6,11,3,RED); R(g,x-1,bot-6,11,1,REDL);
      R(g,x+1,bot-9,2,3,C.g2); R(g,x+6,bot-9,2,3,C.g3); }
    R(g,0,bot,W,3,RED); R(g,0,bot,W,1,REDL); R(g,0,bot+3,W,2,C.white); }
  const tx=LIFT_X-13;
  R(g,tx,12,26,bt+1-12,RED); R(g,tx,12,2,bt+1-12,REDL); R(g,tx+24,12,2,bt+1-12,REDD);

}

  for(const pose in m){ const p=m[pose], c=layer(p.w,p.h); c.getContext('2d').drawImage(SPRITE_ATLAS,p.x,p.y,p.w,p.h,0,0,p.w,p.h);
    out[pose]={r:c,l:flip(c),w:p.w,h:p.h,axR:p.ax,axL:p.w-p.ax,hand:p.hand,handY:p.handY}; }
  return out; }
SPRITE_ATLAS.onload=()=>{ for(const k of Object.keys(CHARS)) if(SPRITE_META[k]) SPR[k]=makeCharAtlas(k); };

// verdict table: best = full points, ok = accepted but not ideal, wrong = rejected
function verdict(it,ch){
  const k=ITEMS[it.type].kind;
  if(k==='small') return ch==='ewaste'?'best':'wrong';
  if(k==='appliance') return ch==='pickup'?'best':ch==='ewaste'?'ok':'wrong';   // TC bulky removal takes big appliances; e-waste bins are meant for small items
  if(it.good) return ch==='give'?'best':ch==='pickup'?'ok':'wrong';  // still usable furniture
  return ch==='pickup'?'best':'wrong';                                // spoilt furniture
}

function updatePlay(dt){
  if(ONE&&day.cd>0){ day.cd-=dt; const ni=Math.min(3,Math.max(0,Math.floor((3.2-day.cd)/0.8))); if(ni!==day.cdIdx){ day.cdIdx=ni; sfx(ni===3?'go':'tick'); } if(day.cd>0.8) return; }   // 3-2-1 freeze, then GO! while play has already started
  if(tut) updateTut(dt); else day.t-=dt; if(stamp){ stamp.t+=dt; if(stamp.t>2.6) stamp=null; } if(hintT>0) hintT-=dt; if(shakeT>0) shakeT-=dt; if(flash>0) flash-=dt;
  for(const k in doorsOpen){ doorsOpen[k]-=dt; if(doorsOpen[k]<=0) delete doorsOpen[k]; }
  if(lift.moving){ const ty=FL[lift.target], d=ty-lift.y, step=120*dt;
    if(Math.abs(d)<=step){ lift.y=ty; lift.fl=lift.target; lift.moving=false; } else lift.y+=Math.sign(d)*step; }

  const inp=readInput(); player.moving=false; if(player.rejectT>0) player.rejectT-=dt;
  if(player.riding){ player.y=lift.y; player.x=LIFT_X; if(!lift.moving){ player.riding=false; player.fl=lift.fl; player.y=FL[player.fl]; } }
  else {
    if(HARD){ if(inp.vy!==0&&nearLift()){ const tgt=player.fl-inp.vy;
      if(tgt>=0&&tgt<=3&&!lift.moving){ if(lift.fl===player.fl){ player.x=LIFT_X; player.riding=true; lift.target=tgt; lift.moving=true; } else { lift.target=player.fl; lift.moving=true; } } } }
    else {   // one press = walk to the lift and ride to the next floor that needs you
      if(inp.vy===0) player.vyLatch=false;
      else if(!player.vyLatch&&!lift.moving){ player.vyLatch=true; const tgt=smartFloor(-inp.vy); if(tgt!==null) player.auto={tgt}; }
      if(player.auto&&inp.hx!==0) player.auto=null;
      if(player.auto){ const d=LIFT_X-player.x;
        if(Math.abs(d)>1.5){ player.x+=Math.sign(d)*Math.min(Math.abs(d),100*dt); player.face=Math.sign(d); player.moving=true; player.anim+=dt; }
        else { player.x=LIFT_X; lift.fl=player.fl; lift.y=FL[player.fl]; lift.target=player.auto.tgt; lift.moving=true; player.riding=true; player.auto=null; } } }
    if(!player.riding&&inp.hx!==0){ const sp=(player.carry?52:76)*inp.hx;
      player.x=Math.max(MIN_X,Math.min(maxX(player.fl),player.x+sp*dt)); player.face=inp.hx>0?1:-1; player.moving=true; player.anim+=dt*Math.abs(inp.hx); }
  }
  player.still=player.moving||player.riding?0:player.still+dt;

  // pick up / sort at stations (stand still briefly to drop off — walking past never triggers)
  if(!player.riding){
    if(!HARD){
      if(state==='playing'&&!player.auto){ for(const it of items){ if(it.held) continue;
        if(it.lock){ if(Math.abs(it.x-player.x)>16||it.fl!==player.fl) it.lock=false; else continue; }
        if(it.fl===player.fl&&Math.abs(it.x-player.x)<10){ startItemChoice(it); break; } } }
    } else if(!player.carry){
      for(const it of items){ if(!it.held&&it.fl===player.fl&&Math.abs(it.x-player.x)<9){ it.held=true; player.carry=it; burst(it.x,it.y-6,['#ffffff','#ffe878'],6); break; } }
    } else if(player.fl===0&&player.still>0.2&&player.rejectT<=0){
      const st=STATIONS.find(s=>Math.abs(player.x-s.x)<=s.half);
      if(st){ const v=verdict(player.carry,st.key);
        if(v==='wrong'){ day.combo=0; player.rejectT=1.2; addFloat(st.x,104,'NOT HERE LAH!','#ff8a7a'); shakeT=0.12; }
        else { const it=player.carry; player.carry=null; items=items.filter(i=>i!==it);
          const pts=award(v==='best'?15:8,v); addScore(pts); totals.sorted++; day.sorted++; if(tut&&tut.step===3){ tut.step=4; tut.t=0; }
          setStamp(v==='best'?'yes':'ok',it); burst(st.x,118,['#8ee052','#ffffff','#ffe878'],16); addFloat(st.x,100,(v==='best'?'SORTED! +':'OK +')+pts,'#8ee052'); } }
    }
  }
  // items left lying in the corridor become a fire hazard
  for(const it of items){ if(it.held) continue; if(!tut) it.t+=dt; if(it.bounce>0) it.bounce-=dt;
    if(!ONE&&it.t>=FIRE_T&&!it.gone){ it.gone=true; loseHeart(it.x,it.y-24); burst(it.x,it.y-6,['#ff5a4a','#ffb020','#ffe878'],14); } }
  items=items.filter(i=>!i.gone);

  for(const n of npcs){
    n.anim+=dt; if(n.dlgT>0&&n.dlgKind!=='caught') n.dlgT-=dt; n.t+=dt; if(n.alpha<1) n.alpha=Math.min(1,n.alpha+dt*3);
    if(n.state==='walk'){
      if(!n.said&&n.t>0.5){ n.said=true; say(n,intentLine(n),'intent',2); }
      const d=n.tx-n.x; if(Math.abs(d)<1){ n.state='hesitate'; n.t=0; } else { n.x+=Math.sign(d)*Math.min(Math.abs(d),n.speed*dt); n.face=Math.sign(d); }
    } else if(n.state==='hesitate'){ n.face=(Math.floor(n.t*4)%2)?1:-1; if(n.t>(HARD?1.2:ONE?2.2-0.9*Math.min(1,Math.max(0,1-day.t/TH.dur)):2.2)&&!n.tut) dropItem(n,false); }
    else if(n.state==='return'){ const home=n.fl===0?-14:UNIT_DOORS[n.door]+6, d=home-n.x;
      if(Math.abs(d)<1){ if(n.fl>0) doorsOpen[n.fl+':'+n.door]=0.5; n.state='gone'; }
      else { n.x+=Math.sign(d)*Math.min(Math.abs(d),(n.speed+8)*dt); n.face=Math.sign(d); } }
    if(state==='playing'&&!player.riding&&player.fl===n.fl&&(n.state==='walk'||n.state==='hesitate')&&Math.abs(player.x-n.x)<11){ startChoice(n); break; }
  }
  npcs=npcs.filter(n=>n.state!=='gone'||n.dlgT>0);

  const prog=1-Math.max(0,day.t)/TH.dur;
  if(ONE&&!day.rushed&&day.t<15&&!tut){ day.rushed=true; addFloat(160,70,'FINAL RUSH!','#ff8a7a',10); shakeT=0.15; sfx('rush'); }
  day.spawnT-=dt*(ONE&&day.t<15?1.6:1);
  const active=npcs.filter(n=>n.state==='walk'||n.state==='hesitate').length;
  if(!tut&&day.spawnT<=0&&active<(ONE?(prog>0.55?4:3):HARD?TH.maxActive:[2,2,3][dayIdx])){ spawnNPC(); day.spawnT=(TH.spawn[0]+(TH.spawn[1]-TH.spawn[0])*prog+Math.random()*0.8)*(HARD?1:ONE?1.15:1.3); }

  if(ONE){ const c=clogN(); day.playT+=dt; day.clearAcc+=dt*(1-Math.min(1,c/MAXCLOG)); if(c>=MAXCLOG) day.blocked=true; }
  if(day.t<=0||day.hearts<=0||day.blocked){ day.t=Math.max(0,day.t); setState('dayend'); }
}

  for(const f of flyers){ f.t+=dt; const k=Math.min(1,f.t/f.dur);

function S(v){ return Math.round(v*SCALE); }
function outlined(txt,x,y,col,align,o){
  ctx.textAlign=align||'center'; o=o||Math.max(1,SCALE/2|0);
  ctx.fillStyle=C.ink; for(const [ox,oy] of [[-o,0],[o,0],[0,-o],[0,o],[o,o],[-o,-o],[o,-o],[-o,o]]) ctx.fillText(txt,x+ox,y+oy);
  ctx.fillStyle=col; ctx.fillText(txt,x,y);
}
function wrap(txt,maxW){ const words=txt.split(' '), lines=[]; let cur='';
  for(const w of words){ const t=cur?cur+' '+w:w; if(ctx.measureText(t).width>maxW&&cur){ lines.push(cur); cur=w; } else cur=t; }
  if(cur) lines.push(cur); return lines; }

  const border=kind==='ok'?'#2e9b3a':kind==='bad'?'#d9473a':kind==='caught'?'#2a78c8':C.ink;
  ctx.globalAlpha=alpha; box(bx,by,bw,bh,'#ffffff',border);
  const tx=Math.max(bx+S(3),Math.min(bx+bw-S(5),ax-S(1)));

  ctx.fillStyle=C.ink; ctx.textAlign='left'; lines.forEach((l,i)=>ctx.fillText(l,bx+pad,by+pad+i*lh)); ctx.globalAlpha=1;

function startDemo(){ if(state!=='title'||demo) return; demo=true; document.getElementById('titleScreen').style.display='none';
  resetRun(); startDay(0); firstChoiceDone=true; hintT=0; day.cd=0; day.spawnT=0.3; setState('playing'); }
function endDemo(board){ demo=false; backToTitle(); if(board) lbAttractShow(); }

function demoBot(){ demoIn.hx=0; demoIn.vy=0;
  if(state==='choice'){ if(choice.ph===1&&choice.pt>choice.intro+0.9){ const it=choice.pick||choice.n.item, best=STATIONS.map(x=>x.key).filter(k=>verdict(it,k)==='best'); resolveChoice(best[0]||'pickup'); } return; }
  if(state!=='playing'||player.riding||player.auto) return;
  const c=[...npcs.filter(n=>n.state==='walk'||n.state==='hesitate'),...items.filter(i=>!i.held)]; if(!c.length) return;
  c.sort((a,b)=>Math.abs(a.fl-player.fl)-Math.abs(b.fl-player.fl)||Math.abs(a.x-player.x)-Math.abs(b.x-player.x)); const t=c[0];
  if(t.fl!==player.fl) demoIn.vy=t.fl>player.fl?-1:1; else { const d=t.x-player.x; if(Math.abs(d)>4) demoIn.hx=Math.max(-1,Math.min(1,d/10)); } }
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,e=>{ titleIdle=0; if(demo){ e.stopPropagation(); exitDemoAndStart(); } },{capture:true,passive:true}));
function update(dt){
  if(demo){ lastInput=performance.now(); demoBot(); if(state==='playing'&&day.t<(ONE?32:20)){ endDemo(true); return; } }
  clock+=dt; stateT+=dt;
  const idle=(performance.now()-lastInput)/1000;   // unattended kiosk: return to title
  if((state==='finale'&&idle>60)||(state!=='finale'&&state!=='walk'&&state!=='peel'&&state!=='zoom'&&idle>40)){ lastInput=performance.now(); backToTitle(); return; }
  for(const c of clouds){ c.x+=dt*(2+c.s*1.5); if(c.x>VW+10) c.x=-50; }
  if(state==='playing') updatePlay(dt);
  else if(state==='choice'){ if(ONE&&firstChoiceDone) day.t-=dt; choice.pt+=dt; if(choice.ph===0){ if(choice.pt>=choice.intro) choice.ph=1; } else { choice.t-=dt; if(choice.t<=0) resolveChoice(null); } }
  else if(state==='peel'){ if(stateT>1.4) setState(ONE?'playing':'daycard'); }
  else if(state==='daycard'){ if(stateT>1.6){ setState('playing'); if(!ONE&&dayIdx===0&&!tutDoneRun) startTutorial(); } }
  else if(state==='dayend'){ if(demo){ endDemo(true); return; } if(stateT>(ONE?2.8:2.4)){ if(!ONE&&dayIdx<2){ walkX=0; guni={x:VW+230}; setState('walk'); } else startFinale(); } }
  else if(state==='walk'){ walkX+=dt*60; if(guni) guni.x-=dt*70; if(stateT>5.5){ startDay(dayIdx+1); setState('peel'); } }
  else if(state==='finale'){ if(Math.random()<dt*(pledged?60:25)) confettiBurst();
    if(stateT>3.1&&!endShown){ endShown=true; document.getElementById('endBtns').classList.add('on'); }
    if(stateT>4.6&&!lbAuto){ lbAuto=true; if(lbQualifies()||(ONE&&score>0)) lbOpen(); } }
  updateFx(dt);
}
function confettiBurst(){ const cols=['#ffe878','#ff5a4a','#4cb3ee','#8ee052','#ff8fb0','#ffffff'];
  parts.push({x:Math.random()*VW,y:-2,vx:(Math.random()-0.5)*20,vy:20+Math.random()*30,c:pick(cols),life:3,ml:3,g:6,sz:2}); }

  const cast=[...met.slice(0,3),'hero',...met.slice(3)];

  try{ if((el.requestFullscreen||el.webkitRequestFullscreen)&&!isFS()) enterFS(); }catch(e){}

function audioUnlock(){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); const b=AC.createBuffer(1,1,22050), n=AC.createBufferSource(); n.buffer=b; n.connect(AC.destination); n.start(0); }catch(e){} }
['pointerdown','touchstart','keydown','click'].forEach(ev=>window.addEventListener(ev,audioUnlock,{capture:true,passive:true}));

  if(state!=='title') return; autoFS(); audioUnlock();

const LB_N=8;
const todayKey=()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
let lbMem={k:'',l:[]};
function lbLoad(){ const k=todayKey(); try{ const v=localStorage.getItem('bp12_lb_'+k); if(v!==null) return JSON.parse(v); }catch(e){} return lbMem.k===k?lbMem.l.slice():[]; }
function lbStore(l){ lbMem={k:todayKey(),l:l.slice(0,30)}; try{ localStorage.setItem('bp12_lb_'+todayKey(),JSON.stringify(l.slice(0,30)));
  const keep='bp12_lb_'+todayKey(); for(let i=localStorage.length-1;i>=0;i--){ const k=localStorage.key(i); if(k&&k.indexOf('bp12_lb_')===0&&k<keep) localStorage.removeItem(k); } }catch(e){} }

let lbSaved=false, lbName='', lbMe=-1, lbAttract=false, lbAttractT=null, lbWho='';
const LB_TIPS=['MANY TOWN COUNCILS OFFER FREE BULKY ITEM REMOVAL. BOOK AHEAD!','PUT BULKY ITEMS OUT ON COLLECTION DAY ONLY.','SMALL GADGETS CAN GO INTO E-WASTE BINS.','BUYING A NEW APPLIANCE? THE SHOP CAN TAKE YOUR OLD ONE.','STILL GOOD? PASS IT ON TO A NEIGHBOUR WHO NEEDS IT.'];

  else if(score<=0) nx.textContent='PLAY A ROUND TO ENTER THE BOARD';
  else if(l.length>=LB_N&&!lbSaved){ const t=l[LB_N-1]; nx.textContent=`YOU: #${lbRankOf(score,runClear(),l)} · BEAT ${t.n} (${String(t.s).padStart(5,'0')}) TO ENTER`; }
  else nx.textContent=''; }
let thxTimer=null;
function thxPick(){ if(thx) return thx; const pc=runClear(), uniq=[...new Set(totals.helped)];
  const key=totals.helped.length?pick(totals.helped):(pc>=70?'ahma':pc>=40?'mei':'jason');

function thxRender(){ const th=document.getElementById('lbThanks'), on=!lbAttract&&score>0&&ONE&&!document.getElementById('lbPanel').classList.contains('entry'); th.classList.toggle('on',on); clearInterval(thxTimer); if(!on) return;
